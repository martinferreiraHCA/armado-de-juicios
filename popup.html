<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>SIGED · Juicios IA</title>
  <style>
    body{margin:0;padding:16px;width:300px;font:13px/1.5 system-ui,sans-serif;background:#0f172a;color:#f1f5f9}
    h1{margin:0 0 2px;font-size:15px}
    .sub{color:#94a3b8;font-size:11.5px;margin:0 0 14px}
    .estado{background:#1e293b;border:1px solid #334155;border-radius:10px;padding:12px;margin-bottom:12px}
    .estado .modo{font-weight:700;font-size:13px}
    .estado .det{color:#94a3b8;font-size:11.5px;margin-top:4px}
    .estado.warn{border-color:#fbbf24}
    .estado.warn .det{color:#fbbf24}
    button.primary{background:#3b82f6;color:#fff;border:0;padding:11px 12px;border-radius:8px;cursor:pointer;font:inherit;font-weight:600;width:100%}
    button.primary:hover{background:#2563eb}
    .atajos{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
    .atajos button{background:#1e293b;color:#f1f5f9;border:1px solid #334155;border-radius:8px;padding:8px 6px;cursor:pointer;font:inherit;font-size:11.5px}
    .atajos button:hover{background:#273449}
  </style>
</head>
<body>
  <h1>SIGED · Juicios IA</h1>
  <p class="sub">Generador de juicios para SIGED</p>

  <div class="estado" id="estado">
    <div class="modo" id="estadoModo">Cargando…</div>
    <div class="det" id="estadoDet"></div>
  </div>

  <button class="primary" id="abrirConfig">⚙️ Abrir configuración completa</button>

  <div class="atajos">
    <button data-tab="plantillas">📝 Plantillas</button>
    <button data-tab="banco">🗂️ Banco</button>
    <button data-tab="asistente">✨ Asistente</button>
    <button data-tab="bases">💾 Mis bases</button>
  </div>

  <script src="providers.js"></script>
  <script src="popup.js"></script>
</body>
</html>
